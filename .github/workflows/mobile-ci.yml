name: Mobile CI

on:
  pull_request:
    paths:
      - "expo/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "expo/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test
      - name: Run type and lint checks
        run: bun run check
      - name: Run Expo Doctor
        run: bunx expo-doctor
      - name: Export all platforms
        run: bun run export
