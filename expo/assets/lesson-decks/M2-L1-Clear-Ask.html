  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    return btoa(bin);

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {

        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

{ 0% { opacity:0; transform:translateY(8px) } 12% { opacity:1; transform:none } 82% { opacity:1; transform:none } 100% { opacity:0; transform:translateY(-4px) } }\n  @keyframes bysiSheet { from { transform:translateY(100%) } to { transform:none } }\n  @keyframes bysiDrift { 0%,100% { transform:scale(1) translate(0,0) } 50% { transform:scale(1.05) translate(6px,-4px) } }\n  @keyframes bysiWishFold {\n    0% { opacity:.95; transform:scale(1,1) }\n    42% { opacity:.8; transform:scale(.86,.54) }\n    76% { opacity:.46; transform:scale(.97,.28) }\n    100% { opacity:0; transform:scale(1,.2) }\n  }\n  @keyframes bysiGhost { 0% { opacity:0 } 34% { opacity:.62 } 72% { opacity:.5 } 100% { opacity:0 } }\n  @keyframes bysiGlow { 0%,100% { box-shadow:0 0 0 0 rgba(81,40,136,.34) } 50% { box-shadow:0 0 0 7px rgba(81,40,136,0) } }\n  @media (prefers-reduced-motion: reduce) {\n    [data-bysi] *, [data-bysi] { animation:none !important; transition:none !important }\n  }\n\n  /* Premium pass: press states and tabular figures (design.md \u00a76, \u00a77) */\n  [data-tnum] { font-variant-numeric:tabular-nums !important; font-feature-settings:'tnum' 1, 'lnum' 1 !important; }\n  button { -webkit-tap-highlight-color:transparent; transition:transform 110ms cubic-bezier(.22,.9,.28,1), filter 110ms cubic-bezier(.22,.9,.28,1); }\n  button:not(:disabled):active { transform:scale(.972); filter:brightness(.94); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"display:flex;flex-wrap:wrap;gap:34px;align-items:flex-start;padding:34px;background:#EFEEF4;min-height:100vh;box-sizing:border-box\">\n\n  <div style=\"display:flex;flex-direction:column;gap:16px;flex:none\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <span style=\"font:600 10px/1 'Plus Jakarta Sans';letter-spacing:1.6px;text-transform:uppercase;color:#512888\">Module 2 \u00b7 Lesson 1<\u002Fspan>\n      <span style=\"font:600 10px/1 'Plus Jakarta Sans';letter-spacing:1.6px;text-transform:uppercase;color:#646D77\">22 cards<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"margin:0;font:700 30px/1.12 'Plus Jakarta Sans';letter-spacing:-.025em;max-width:393px;text-wrap:pretty\">When You've Said It Three Times and Nothing Changed<\u002Fh1>\n    <p style=\"margin:0;font:400 13px/1.5 'Plus Jakarta Sans';color:#646D77;max-width:393px;text-wrap:pretty\"><strong style=\"color:#3E454D\">Persistence fixture.<\u002Fstrong> This prototype does not store data beyond the current preview. Card 20 hands off to the shared live AI voice engine, which is not included here.<\u002Fp>\n    <p style=\"margin:0;font:400 15px/1.55 'Plus Jakarta Sans';color:#4B5259;max-width:393px;text-wrap:pretty\">Tap the right side of the card to advance, the left to go back. Both quizzes, the card 15 payoff, the rehearsal handoff and the card 22 completion are live.<\u002Fp>\n\n    <div data-bysi=\"deck\" data-screen-label=\"{{ screenLabel }}\" style=\"width:393px;height:852px;flex:none;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:#FAF7F2;border:1px solid rgba(23,26,31,.16);box-shadow:0 26px 60px rgba(23,26,31,.16)\">\n\n      <div style=\"flex:none;height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;box-sizing:border-box\">\n        <span style=\"font:600 13px/1 'Plus Jakarta Sans';color:#171A1F\">9:41<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:5px\">\n          <span style=\"width:16px;height:9px;border-radius:2px;border:1px solid rgba(23,26,31,.4);display:block\"><\u002Fspan>\n          <span style=\"width:22px;height:10px;border-radius:3px;border:1px solid rgba(23,26,31,.4);display:block\"><\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"flex:none;display:flex;align-items:center;gap:14px;padding:8px 22px 14px\">\n        <button type=\"button\" aria-label=\"Restart lesson\" sc-camel-on-click=\"{{ restart }}\" style=\"width:44px;height:44px;margin:-9px 0 -9px -9px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 17px/1 'Plus Jakarta Sans';color:#646D77;cursor:pointer;background:transparent;border:none;padding:0;-webkit-appearance:none\" style-hover=\"background:rgba(23,26,31,.06)\">\u00d7<\u002Fbutton>\n        <span style=\"flex:1;height:5px;border-radius:99px;background:rgba(23,26,31,.10);overflow:hidden;display:block\">\n          <span style=\"display:block;height:100%;border-radius:99px;background:#512888;transition:width .34s cubic-bezier(.4,0,.2,1);width:{{ progressPct }}\"><\u002Fspan>\n        <\u002Fspan>\n        <span style=\"flex:none;font:600 11px/1 'Plus Jakarta Sans';letter-spacing:.06em;color:#646D77;font-variant-numeric:tabular-nums\" data-tnum=\"\">{{ counter }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;position:relative;display:flex;flex-direction:column;min-height:0\">\n\n        <div style=\"flex:1;display:flex;flex-direction:column;padding:6px 26px 0;min-height:0;overflow:hidden\">\n          <sc-if value=\"{{ isHero }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font:700 32px/1.16 'Plus Jakarta Sans';letter-spacing:-.03em;color:#171A1F;animation:bysiRise .42s ease-out both\">One action.<\u002Fspan>\n                <span style=\"font:700 32px/1.16 'Plus Jakarta Sans';letter-spacing:-.03em;color:#171A1F;animation:bysiRise .42s .1s ease-out both\">One owner.<\u002Fspan>\n                <span style=\"font:700 32px/1.16 'Plus Jakarta Sans';letter-spacing:-.03em;color:#512888;animation:bysiRise .42s .2s ease-out both\">Room to answer.<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:0;font:400 17px/1.6 'Plus Jakarta Sans';color:#3E454D;max-width:30ch;text-wrap:pretty;animation:bysiRise .42s .3s ease-out both\">Something they could do. Someone who can answer. And an answer that's really available.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isStandard }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"flex:1;display:flex;flex-direction:column;gap:20px;min-height:0\">\n              <span style=\"flex:0 1 103px;min-height:0;display:block\" aria-hidden=\"true\"><\u002Fspan>\n              <div style=\"flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;min-height:176px\">\n                {{ visual }}\n                <sc-if value=\"{{ vchips.length }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"width:100%;display:flex;flex-direction:column;gap:6px\">\n                    <sc-for list=\"{{ vchips }}\" as=\"vc\" hint-placeholder-count=\"1\">\n                      <span style=\"{{ vc.style }}\">{{ vc.x }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"flex:none;display:flex;flex-direction:column;gap:12px\">\n                <sc-if value=\"{{ showH }}\" hint-placeholder-val=\"{{ true }}\">\n                  <h2 style=\"margin:0;font:700 24px/1.22 'Plus Jakarta Sans';letter-spacing:-.02em;color:#171A1F;text-wrap:pretty\">{{ card.h }}<\u002Fh2>\n                <\u002Fsc-if>\n                <sc-for list=\"{{ blocks }}\" as=\"b\" hint-placeholder-count=\"1\">\n                  <sc-if value=\"{{ b.isP }}\" hint-placeholder-val=\"{{ true }}\">\n                    <p style=\"margin:0;font:400 16.5px/1.55 'Plus Jakarta Sans';color:#3E454D;text-wrap:pretty\">{{ b.x }}<\u002Fp>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ b.isQuote }}\" hint-placeholder-val=\"{{ false }}\">\n                    <p style=\"margin:0;font:italic 400 15.5px/1.6 'Plus Jakarta Sans';color:#2E343B;text-wrap:pretty\">{{ b.x }}<\u002Fp>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ b.isLabelled }}\" hint-placeholder-val=\"{{ false }}\">\n                    <p style=\"margin:0;font:400 15px/1.55 'Plus Jakarta Sans';color:#2E343B;text-wrap:pretty\"><span style=\"font:600 10px/1 'Plus Jakarta Sans';letter-spacing:1.4px;text-transform:uppercase;color:#512888;display:block;margin-bottom:5px\">{{ b.label }}<\u002Fspan><em>{{ b.x }}<\u002Fem><\u002Fp>\n                  <\u002Fsc-if>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ chips.length }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:7px;align-items:{{ chipAlign }};margin-top:-6px\">\n                  <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"3\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ c.save }}\" style=\"{{ c.style }}\"><sc-if value=\"{{ c.kind }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font:600 9px/1 'Plus Jakarta Sans';letter-spacing:1.3px;text-transform:uppercase;color:#512888;display:block;margin-bottom:5px\">{{ c.kind }}<\u002Fspan><\u002Fsc-if>{{ c.x }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isPayoff2 }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:14px;min-height:0;padding-top:2px\">\n              <h2 style=\"margin:0;font:700 24px/1.22 'Plus Jakarta Sans';letter-spacing:-.02em;text-wrap:pretty\">{{ card.h }}<\u002Fh2>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <div style=\"width:100%\">{{ payoffA }}<\u002Fdiv>\n                <p style=\"margin:0;font:400 14.5px/1.5 'Plus Jakarta Sans';color:#2E343B;text-wrap:pretty\"><span style=\"font:600 10px/1 'Plus Jakarta Sans';letter-spacing:1.4px;text-transform:uppercase;color:#512888;display:block;margin-bottom:5px\">Before<\u002Fspan><em>\u201cThe handoff keeps arriving after the meeting starts.\u201d<\u002Fem><\u002Fp>\n                <span style=\"align-self:flex-start;padding:6px 11px;border-radius:99px;background:rgba(168,69,42,.10);border:1px solid rgba(168,69,42,.34);font:500 12px/1.25 'Plus Jakarta Sans';color:#A8452A\">A problem to nod at.<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"height:1px;background:rgba(23,26,31,.10);display:block\"><\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:9px\">\n                <div style=\"width:100%\">{{ payoffB }}<\u002Fdiv>\n                <p style=\"margin:0;font:400 14.5px/1.5 'Plus Jakarta Sans';color:#2E343B;text-wrap:pretty\"><span style=\"font:600 10px/1 'Plus Jakarta Sans';letter-spacing:1.4px;text-transform:uppercase;color:#512888;display:block;margin-bottom:5px\">After<\u002Fspan><em>\u201cMaya, can you <strong style=\"font-style:normal;font-weight:600;color:#512888;background:rgba(81,40,136,.12);border-radius:4px;padding:0 3px\">send the revised two-page brief by 3 on Thursday<\u002Fstrong>? The review\u2019s at 4. <strong style=\"font-style:normal;font-weight:600;color:#512888;background:rgba(81,40,136,.12);border-radius:4px;padding:0 3px\">Does that work, or is Thursday tight?<\u002Fstrong>\u201d<\u002Fem><\u002Fp>\n                <span style=\"align-self:flex-start;padding:6px 11px;border-radius:99px;background:rgba(81,40,136,.10);border:1px solid rgba(81,40,136,.30);font:500 12px/1.25 'Plus Jakarta Sans';color:#512888\">A question to answer.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isPlaybook }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px\">\n              <div style=\"display:flex;flex-direction:column;gap:16px\">\n                <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;gap:11px\">\n                    <span style=\"flex:none;width:13px;font:700 15px/1 'Plus Jakarta Sans';color:#8A929B\">{{ s.n }}<\u002Fspan>\n                    <span style=\"flex:none;min-width:78px;height:32px;padding:0 11px;border-radius:9px;background:#512888;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font:600 9px/1 'Plus Jakarta Sans';letter-spacing:1.1px;text-transform:uppercase\">{{ s.pill }}<\u002Fspan>\n                    <span style=\"flex:1;display:flex;flex-direction:column;gap:3px;min-width:0\">\n                      <span style=\"font:600 13px/1.3 'Plus Jakarta Sans';color:#171A1F\">{{ s.title }}<\u002Fspan>\n                      <span style=\"font:400 11.5px/1.35 'Plus Jakarta Sans';color:#646D77\">{{ s.stub }}<\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"width:100%\">{{ s.mini }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-for list=\"{{ blocks }}\" as=\"b\" hint-placeholder-count=\"1\">\n                <p style=\"margin:0;font:400 16.5px/1.55 'Plus Jakarta Sans';color:#3E454D;text-wrap:pretty\">{{ b.x }}<\u002Fp>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isDQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1;display:flex;flex-direction:column;gap:16px;min-height:0\">\n              <span style=\"font:600 10px/1 'Plus Jakarta Sans';letter-spacing:1.6px;text-transform:uppercase;color:#646D77;text-align:center\">{{ dqCount }}<\u002Fspan>\n              <h2 style=\"margin:0;font:700 21px/1.28 'Plus Jakarta Sans';letter-spacing:-.015em;text-align:center;text-wrap:pretty\">{{ card.h }}<\u002Fh2>\n              <sc-if value=\"{{ dqFrag }}\" hint-placeholder-val=\"{{ true }}\">\n                <p style=\"margin:0;font:italic 400 15.5px/1.5 'Plus Jakarta Sans';color:#2E343B;text-align:center;text-wrap:pretty\">{{ dqFrag }}<\u002Fp>\n              <\u002Fsc-if>\n              <div style=\"display:flex;gap:7px;width:100%\">\n                <sc-for list=\"{{ dqSlots }}\" as=\"d\" hint-placeholder-count=\"4\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ d.act }}\" style=\"{{ d.style }}\">{{ d.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1;display:flex;flex-direction:column;gap:14px;min-height:0\">\n              <span style=\"font:600 10px/1 'Plus Jakarta Sans';letter-spacing:1.6px;text-transform:uppercase;color:#646D77;text-align:center\">Select an answer<\u002Fspan>\n              <h2 style=\"margin:0;font:700 21px/1.28 'Plus Jakarta Sans';letter-spacing:-.015em;text-align:center;text-wrap:pretty\">{{ card.h }}<\u002Fh2>\n              <sc-if value=\"{{ quizSetup }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"margin:0;font:italic 400 14.5px/1.5 'Plus Jakarta Sans';color:#2E343B;text-align:center;text-wrap:pretty\">{{ quizSetup }}<\u002Fp>\n              <\u002Fsc-if>\n              <div style=\"flex:none;display:flex;justify-content:center;min-height:52px\">{{ visual }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px\">\n                <sc-for list=\"{{ options }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" aria-pressed=\"{{ o.selected }}\" style=\"{{ o.style }}\">{{ o.x }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isHandoff }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px\">\n              <div style=\"opacity:.2\">{{ visual }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:11px\">\n                <h2 style=\"margin:0;font:700 26px/1.2 'Plus Jakarta Sans';letter-spacing:-.02em\">Now ask it out loud<\u002Fh2>\n                <p style=\"margin:0;font:400 16.5px/1.55 'Plus Jakarta Sans';color:#3E454D;text-wrap:pretty\">The clean version is easy on paper. The test is what you do when they answer with something other than yes.<\u002Fp>\n                <p style=\"margin:0;font:400 13.5px/1.5 'Plus Jakarta Sans';color:#646D77;text-wrap:pretty\">You'll practice this with Maya. The lesson picks up afterward with your saved move.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isSaved }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;position:relative\">\n              <div style=\"position:relative;display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                <span style=\"font:600 10px/1 'Plus Jakarta Sans';letter-spacing:1.6px;text-transform:uppercase;color:#646D77\">Your saved move<\u002Fspan>\n                <sc-if value=\"{{ resumed }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:rgba(23,26,31,.06);font:600 10.5px/1 'Plus Jakarta Sans';color:#4B5259\"><\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"position:relative;background:#FFFFFF;border:1px solid rgba(23,26,31,.12);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:15px;box-shadow:0 12px 30px rgba(23,26,31,.08)\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:4px;align-items:center;font:700 19px/1 'Plus Jakarta Sans';letter-spacing:-.015em;color:#171A1F\">\n                  <span>One<\u002Fspan>\n                  <span style=\"display:inline-flex;align-items:center;white-space:nowrap\">\n                    <span sc-camel-on-click=\"{{ slotA.fill }}\" style=\"{{ slotA.style }}\">{{ slotA.x }}<\u002Fspan>\n                    <span>.<\u002Fspan>\n                  <\u002Fspan>\n                  <span>One<\u002Fspan>\n                  <span style=\"display:inline-flex;align-items:center;white-space:nowrap\">\n                    <span sc-camel-on-click=\"{{ slotB.fill }}\" style=\"{{ slotB.style }}\">{{ slotB.x }}<\u002Fspan>\n                    <span>.<\u002Fspan>\n                  <\u002Fspan>\n                  <span>Room to<\u002Fspan>\n                  <span style=\"display:inline-flex;align-items:center;white-space:nowrap\">\n                    <span sc-camel-on-click=\"{{ slotC.fill }}\" style=\"{{ slotC.style }}\">{{ slotC.x }}<\u002Fspan>\n                    <span>.<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:7px;font:italic 400 15.5px/1.55 'Plus Jakarta Sans';color:#2E343B\">\n                  <span>\u201c<strong style=\"font-style:normal;color:#512888\">[who, if it isn't already obvious]<\u002Fstrong>, can you <strong style=\"font-style:normal;color:#512888\">[action]<\u002Fstrong><\u002Fspan>\n                  <span>by <strong style=\"font-style:normal;color:#512888\">[when, if it changes what done means]<\u002Fstrong>?<\u002Fspan>\n                  <span>Does that work, or is something in the way?\u201d<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"padding-top:13px;border-top:1px solid rgba(23,26,31,.10);display:flex;flex-direction:column;gap:7px;font:400 14px/1.5 'Plus Jakarta Sans';color:#4B5259\">\n                  <span>If they name a constraint: <em>\u201cGot it. Would [other variable] work instead?\u201d<\u002Fem><\u002Fspan>\n                  <span>If they say no: <em>\u201cOkay. I'll make another plan.\u201d<\u002Fem><\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"padding-top:13px;border-top:1px solid rgba(23,26,31,.10);display:flex;flex-direction:column;gap:8px\">\n                  <span style=\"font:600 9px/1 'Plus Jakarta Sans';letter-spacing:1.3px;text-transform:uppercase;color:#646D77\">Filled<\u002Fspan>\n                  {{ savedThumb }}\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"position:relative;font:400 13px/1.45 'Plus Jakarta Sans';color:#646D77\">Saved for this preview only. Fill the slots on the next card, or leave the ones the situation already answers.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isTransfer }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1;display:flex;flex-direction:column;gap:14px;padding-top:4px\">\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <h2 style=\"margin:0;font:700 23px/1.22 'Plus Jakarta Sans';letter-spacing:-.02em;text-wrap:pretty\">One ask you've been circling<\u002Fh2>\n                <p style=\"margin:0;font:400 15px/1.5 'Plus Jakarta Sans';color:#3E454D;text-wrap:pretty\">Fill in what they'd otherwise have to guess. Leave a slot alone if the situation already answers it.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ fields }}\" as=\"f\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;flex-direction:column;gap:6px\">\n                    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:26px\">\n                      <label for=\"{{ f.id }}\" style=\"font:600 10px/1 'Plus Jakarta Sans';letter-spacing:1.5px;text-transform:uppercase;color:{{ f.tint }}\">{{ f.label }}<\u002Flabel>\n                      <sc-if value=\"{{ f.hasSkip }}\" hint-placeholder-val=\"{{ false }}\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ f.toggleSkip }}\" aria-pressed=\"{{ f.skipped }}\" style=\"background:transparent;border:none;padding:6px 2px;font:500 12px/1 'Plus Jakarta Sans';color:#646D77;cursor:pointer;border-bottom:1px solid rgba(23,26,31,.22);-webkit-appearance:none\">{{ f.skipLabel }}<\u002Fbutton>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ f.skipped }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"min-height:48px;border-radius:14px;background:#E9E6F0;display:flex;align-items:center;gap:10px;padding:0 14px;box-sizing:border-box\">\n                        <span style=\"width:19px;height:19px;flex:none;border-radius:50%;background:rgba(23,26,31,.16);display:flex;align-items:center;justify-content:center;font:600 11px/1 'Plus Jakarta Sans';color:#3E454D\">\u2713<\u002Fspan>\n                        <span style=\"font:500 14px/1.3 'Plus Jakarta Sans';color:#4B5259\">{{ f.skippedText }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ true }}\">\n                      <input id=\"{{ f.id }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.set }}\" placeholder=\"{{ f.ph }}\" style=\"{{ f.style }}\">\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <p style=\"margin:0;font:400 13px/1.45 'Plus Jakarta Sans';color:#646D77;text-wrap:pretty\">Then say it, send it, or keep it. All three save it to Your Moves.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px\">\n              <div style=\"width:100%\">{{ visual }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:11px\">\n                <h2 style=\"margin:0;font:700 27px/1.18 'Plus Jakarta Sans';letter-spacing:-.025em\">{{ doneTitle }}<\u002Fh2>\n                <p style=\"margin:0;font:400 16px/1.55 'Plus Jakarta Sans';color:#3E454D;text-wrap:pretty\">{{ doneLine }}<\u002Fp>\n                <sc-if value=\"{{ doneNote }}\" hint-placeholder-val=\"{{ false }}\">\n                  <p style=\"margin:0;font:400 14px/1.5 'Plus Jakarta Sans';color:#646D77;text-wrap:pretty\">{{ doneNote }}<\u002Fp>\n                <\u002Fsc-if>\n                <span style=\"font:400 14px/1.5 'Plus Jakarta Sans';color:#646D77\">Day 2 review: what's the action? Who can answer it? What would they say if the answer is no?<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"flex:none;padding:12px 26px 0;display:flex;flex-direction:column;gap:11px\">\n          <sc-if value=\"{{ toggle.on }}\" hint-placeholder-val=\"{{ false }}\">\n            <button type=\"button\" sc-camel-on-click=\"{{ toggle.act }}\" style=\"{{ toggle.style }}\">{{ toggle.label }}<\u002Fbutton>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ feedback.on }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"{{ feedback.style }}\">\n              <span style=\"font:600 10px/1 'Plus Jakarta Sans';letter-spacing:1.5px;text-transform:uppercase;color:{{ feedback.tint }}\">{{ feedback.title }}<\u002Fspan>\n              <p style=\"margin:0;font:400 14px/1.5 'Plus Jakarta Sans';color:#2E343B;text-wrap:pretty\">{{ feedback.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"flex:none;padding:14px 26px 34px;display:flex;flex-direction:column;gap:10px\">\n          <sc-if value=\"{{ cta.on }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ cta.act }}\" disabled=\"{{ cta.off }}\" style=\"{{ cta.style }}\">{{ cta.label }}<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ transferChoices.length }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:8px\">\n              <sc-for list=\"{{ transferChoices }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <button type=\"button\" sc-camel-on-click=\"{{ t.act }}\" disabled=\"{{ t.off }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isHandoff }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px\">\n              <button sc-camel-on-click=\"{{ openScene }}\" style=\"width:96px;height:96px;border-radius:50%;border:none;background:#512888;box-shadow:0 14px 34px rgba(81,40,136,.34);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px\">\n                <span style=\"width:3px;height:18px;border-radius:9px;background:#FFFFFF;display:block;opacity:.72\"><\u002Fspan>\n                <span style=\"width:3px;height:34px;border-radius:9px;background:#FFFFFF;display:block\"><\u002Fspan>\n                <span style=\"width:3px;height:26px;border-radius:9px;background:#FFFFFF;display:block;opacity:.88\"><\u002Fspan>\n                <span style=\"width:3px;height:42px;border-radius:9px;background:#FFFFFF;display:block\"><\u002Fspan>\n                <span style=\"width:3px;height:20px;border-radius:9px;background:#FFFFFF;display:block;opacity:.72\"><\u002Fspan>\n              <\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ openScene }}\" style=\"background:transparent;border:none;min-height:44px;padding:0 12px;font:600 13px/1 'Plus Jakarta Sans';letter-spacing:.02em;color:#512888;cursor:pointer;-webkit-appearance:none\">Start rehearsal<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ openScene }}\" style=\"background:transparent;border:none;padding:8px 4px;font:500 13px/1 'Plus Jakarta Sans';color:#646D77;cursor:pointer;border-bottom:1px solid rgba(23,26,31,.2);-webkit-appearance:none\">Read the scene first<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showNav }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between\">\n              <span sc-camel-on-click=\"{{ back }}\" style=\"{{ backStyle }}\">Back<\u002Fspan>\n              <span style=\"font:400 12px/1 'Plus Jakarta Sans';color:#646D77\">{{ card.type }}<\u002Fspan>\n              <span sc-camel-on-click=\"{{ next }}\" style=\"{{ nextStyle }}\">{{ nextLabel }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showTapZones }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"position:absolute;inset:0;display:flex;pointer-events:none\">\n            <span sc-camel-on-click=\"{{ back }}\" style=\"flex:0 0 32%;pointer-events:auto;cursor:w-resize\"><\u002Fspan>\n            <span sc-camel-on-click=\"{{ next }}\" style=\"flex:1;pointer-events:auto;cursor:e-resize\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showHint }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;inset:0;display:flex;align-items:center;background:rgba(250,247,242,.86);pointer-events:none\">\n            <span style=\"flex:0 0 32%;text-align:center;font:500 12.5px/1.5 'Plus Jakarta Sans';color:#646D77\">tap here<br>to go back<\u002Fspan>\n            <span style=\"width:1px;height:220px;background:rgba(81,40,136,.35);display:block\"><\u002Fspan>\n            <span style=\"flex:1;text-align:center;font:500 15px/1.5 'Plus Jakarta Sans';color:#171A1F\">tap here<br>to go forward<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;left:0;right:0;bottom:118px;display:flex;justify-content:center;pointer-events:none\">\n            <span style=\"background:#171A1F;color:#FFFFFF;border-radius:99px;padding:10px 18px;font:600 12.5px/1 'Plus Jakarta Sans';animation:bysiToast 1.9s ease both\">{{ toast }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ sceneOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div sc-camel-on-click=\"{{ backdropScene }}\" style=\"position:absolute;inset:0;background:rgba(23,26,31,.36);display:flex;align-items:flex-end;z-index:5\">\n            <div role=\"dialog\" aria-modal=\"true\" aria-label=\"The scene\" tabindex=\"-1\" sc-camel-on-key-down=\"{{ trapKeys }}\" style=\"width:100%;background:#FFFFFF;border-radius:28px 28px 0 0;padding:20px 24px 26px;display:flex;flex-direction:column;gap:11px;animation:bysiSheet .3s cubic-bezier(.4,0,.2,1) both\">\n              <span style=\"font:600 10px/1 'Plus Jakarta Sans';letter-spacing:1.6px;text-transform:uppercase;color:#646D77\">The scene<\u002Fspan>\n              <p style=\"margin:0;font:400 15.5px/1.55 'Plus Jakarta Sans';color:#2E343B;text-wrap:pretty\">Thursday morning, before standup. The handoff brief has landed late three weeks running and the review is at 4. You've mentioned it twice without asking for anything.<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:7px;padding:13px 14px;background:#F4F1EC;border-radius:16px\">\n                <span style=\"font:600 10px/1 'Plus Jakarta Sans';letter-spacing:1.5px;text-transform:uppercase;color:#512888\">What happens<\u002Fspan>\n                <span style=\"font:400 14.5px/1.5 'Plus Jakarta Sans';color:#3E454D\">You open. Maya names a real conflict: <em>\u201cI can't do Thursday.\u201d<\u002Fem> Then she offers half by Thursday. Hope names one change and hands the same moment back to you.<\u002Fspan>\n              <\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ dismissScene }}\" style=\"background:transparent;border:none;padding:10px 4px;text-align:center;font:500 13px/1 'Plus Jakarta Sans';color:#646D77;cursor:pointer;-webkit-appearance:none\">Not now, back to the card<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;gap:10px;width:393px\">\n      <button sc-camel-on-click=\"{{ restart }}\" style=\"min-height:38px;padding:0 16px;border-radius:12px;background:#512888;border:none;color:#FFFFFF;font:600 13px/1 'Plus Jakarta Sans';cursor:pointer\">Restart deck<\u002Fbutton>\n      <span style=\"flex:1;font:400 12.5px/1.45 'Plus Jakarta Sans';color:#646D77\">Card {{ counter }} \u00b7 {{ card.type }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1 1 420px;min-width:400px;display:flex;flex-direction:column;gap:20px\">\n\n    <div style=\"background:#FFFFFF;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font:600 11px/1 'Plus Jakarta Sans';letter-spacing:1.6px;text-transform:uppercase;color:#646D77\">The metaphor is the lesson<\u002Fspan>\n      <p style=\"margin:0;font:400 15px/1.6 'Plus Jakarta Sans';color:#4B5259;text-wrap:pretty\">One metaphor, four states, nothing else drawn. <strong>WISH<\u002Fstrong> is a soft clay-tinted blur with no slots in it: the complaint that has been said three times and has nowhere for a response to land. Card 2 makes it denser, card 3 floats three faint outlines through it that never resolve, card 4 puts a question mark where the ANSWER slot will later sit, and carries the deck's one negative-contrast line as its whole card. <strong>BAR<\u002Fstrong> is ACTION \u2192 WHO \u2192 WHEN \u2192 ANSWER, filling one slot per card. <strong>FORK<\u002Fstrong> opens the ANSWER slot into yes, constraint and no. <strong>NONE<\u002Fstrong> is card 5: the named move in type, on a clean field.<\u002Fp>\n      <p style=\"margin:0;font:400 15px/1.6 'Plus Jakarta Sans';color:#4B5259;text-wrap:pretty\">Purple is spent only on what the learner is being taught to produce: a filled slot, a lit branch, the saved move, the mic. Clay marks what the lesson is correcting: the wish, the fractured ANSWER on card 13, and the received-meaning chips on cards 3 and 8. Grey is what the other person would have to guess.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:#FFFFFF;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font:600 11px/1 'Plus Jakarta Sans';letter-spacing:1.6px;text-transform:uppercase;color:#646D77\">The BAR is a diagnostic, not a form<\u002Fspan>\n      <p style=\"margin:0;font:400 15px/1.6 'Plus Jakarta Sans';color:#4B5259;text-wrap:pretty\">Nothing in the deck counts slots. There is no \u201c3 of 4\u201d, no strength meter, no completion gate on WHEN or WHO. The three slot states are visually distinct and the middle one is the point of the build:<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ slotStates }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;gap:12px;align-items:flex-start;padding-bottom:10px;border-bottom:1px solid rgba(23,26,31,.10)\">\n            <span style=\"flex:0 0 96px;font:600 13px/1.35 'Plus Jakarta Sans';color:{{ s.tint }}\">{{ s.name }}<\u002Fspan>\n            <span style=\"flex:1;font:400 14px/1.5 'Plus Jakarta Sans';color:#4B5259\">{{ s.spec }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin:0;font:400 14px/1.55 'Plus Jakarta Sans';color:#4B5259;text-wrap:pretty\">Card 11 lets the learner switch WHEN between unfilled, valid-empty and filled so the accepted-blank state is taught, not just tolerated. Card 22 carries the same control, and the neutral check appears only after a deliberate skip.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:#FFFFFF;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font:600 11px/1 'Plus Jakarta Sans';letter-spacing:1.6px;text-transform:uppercase;color:#646D77\">Card system<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ layoutSpecs }}\" as=\"s\" hint-placeholder-count=\"7\">\n          <div style=\"display:flex;gap:12px;align-items:flex-start;padding-bottom:10px;border-bottom:1px solid rgba(23,26,31,.10)\">\n            <span style=\"flex:0 0 104px;font:600 13px/1.35 'Plus Jakarta Sans';color:#512888\">{{ s.name }}<\u002Fspan>\n            <span style=\"flex:1;font:400 14px/1.5 'Plus Jakarta Sans';color:#4B5259\">{{ s.spec }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:20px;flex-wrap:wrap\">\n      <div style=\"flex:1 1 260px;background:#FFFFFF;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font:600 11px/1 'Plus Jakarta Sans';letter-spacing:1.6px;text-transform:uppercase;color:#646D77\">Tokens<\u002Fspan>\n        <sc-for list=\"{{ tokens }}\" as=\"t\" hint-placeholder-count=\"7\">\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <span style=\"width:18px;height:18px;border-radius:5px;flex:none;border:1px solid rgba(23,26,31,.12);background:{{ t.c }}\"><\u002Fspan>\n            <span style=\"flex:1;font:400 13.5px/1.4 'Plus Jakarta Sans';color:#4B5259\">{{ t.n }}<\u002Fspan>\n            <span style=\"font:500 12px/1 'Plus Jakarta Sans';color:#646D77\">{{ t.c }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <span style=\"font:400 13px/1.5 'Plus Jakarta Sans';color:#5B646E;padding-top:8px;border-top:1px solid rgba(23,26,31,.10)\">Plus Jakarta Sans only, carried from Module 1. Headline 24/700 \u2212.02em, body 16.5/1.55, quote 15.5 italic, eyebrow 10/600 1.6px, slot label 9/600 1.2px. Frame 393 \u00d7 852, 59 top / 34 bottom safe area, 26px gutter.<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"flex:1 1 260px;background:#FFFFFF;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font:600 11px/1 'Plus Jakarta Sans';letter-spacing:1.6px;text-transform:uppercase;color:#646D77\">Motion rules<\u002Fspan>\n        <sc-for list=\"{{ motionRules }}\" as=\"m\" hint-placeholder-count=\"6\">\n          <span style=\"font:400 13.5px/1.5 'Plus Jakarta Sans';color:#4B5259\">{{ m }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#FFFFFF;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:10px\">\n      <span style=\"font:600 11px/1 'Plus Jakarta Sans';letter-spacing:1.6px;text-transform:uppercase;color:#646D77\">Assumptions and cautions<\u002Fspan>\n      <sc-for list=\"{{ cautions }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <span style=\"font:400 14px/1.55 'Plus Jakarta Sans';color:#4B5259\">{{ c }}<\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1520,&quot;height&quot;:1080},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prototype&quot;}}\">\nconst h = React.createElement;\nconst P = '#512888', CLAY = '#A8452A', INK = '#171A1F', DIM = '#646D77';\nconst MUTED = '#E9E6F0', GRAYTXT = '#646D77', W = '#FFFFFF';\nconst F = \"'Plus Jakarta Sans'\";\nconst SLOTS = ['action', 'who', 'when', 'answer'];\n\n/* Received-meaning chips: what the sentence lands as, in the listener's\n   words. Clay for the reading that misses, purple for the one that lands.\n   The chip carries the guessing that card 3's headline used to state. */\nconst CARDS = [\n  { n:1, type:'Situation', v:'wish', h:'Three Times, Same Handoff',\n    b:[{ t:'p', x:\"You've raised it in standup twice and once over Slack. The handoff still lands after the meeting has started.\" }] },\n  { n:2, type:'Pressure recognition', v:'wish2', h:'',\n    b:[{ t:'p', x:\"You weren't silent. You said it clearly and more than once.\" }] },\n  { n:3, type:'Weak / default response', v:'wish3', h:'',\n    b:[{ t:'q', x:'\u201cThe handoff keeps arriving after the meeting starts.\u201d' },\n       { t:'q', x:'\u201cWe really need to get tighter on timing.\u201d' },\n       { t:'q', x:'\u201cThis is still happening.\u201d' }],\n    vchips:[{ x:'\u201cWhat do you want me to do?\u201d', tone:'clay' }] },\n  { n:4, type:'Reframe', v:'wish4', h:'A complaint names the problem. Not the response.', b:[] },\n  { n:5, type:'Named move', v:'none', h:'One action. One owner. Room to answer.', hero:true, b:[] },\n  { n:6, type:'Visual model', v:'bar0', h:'',\n    b:[{ t:'p', x:\"Only fill what they'd otherwise have to guess.\" }] },\n  { n:7, type:'Visual model \u00b7 build 1', v:'bar1', h:'',\n    b:[{ t:'p', x:\"Something you'd see or hear if it happened.\" }] },\n  { n:8, type:'Distinction', v:'barpair', h:'',\n    b:[{ t:'q', x:'\u201cYou\\u2019re unreliable about deadlines.\u201d' },\n       { t:'q', x:'\u201cSend pages 2 to 4 by noon and flag anything factually wrong.\u201d' },\n       { t:'p', x:'One is about who they are. One can happen on a Tuesday.' }],\n    vchips:[{ x:'About who they are', tone:'clay' }, { x:'A thing to do Tuesday', tone:'purple' }] },\n  { n:9, type:'Exact phrase', v:'bar1', h:'Turn the quality into an action',\n    b:[{ t:'p', x:'Tap a line to keep it.' }], chipAlign:'flex-start',\n    chips:[{ kind:'Work \u00b7 \u201cbe more responsive\u201d', x:'\u201cCould you reply by noon, even if it\\u2019s just to say you need more time?\u201d' },\n           { kind:'Home \u00b7 \u201chelp more with school stuff\u201d', x:'\u201cCould you own Friday pickup this month?\u201d' },\n           { kind:'Friend \u00b7 \u201cnobody checks in\u201d', x:'\u201cCould you call me for ten minutes after 7 tonight?\u201d' }] },\n  { n:10, type:'Visual model \u00b7 build 2', v:'bar2', h:'',\n    b:[{ t:'p', x:\"\u201cCan someone follow up?\u201d leaves everyone free to assume it's someone else.\" }] },\n  { n:11, type:'Visual model \u00b7 build 3', v:'barwhen', h:'',\n    b:[{ t:'p', x:'Add a deadline only when it changes what done means.' }] },\n  { n:12, type:'Visual model \u00b7 build 4', v:'bar4', h:'',\n    b:[{ t:'p', x:'End in a form that can take a yes, a no, a constraint or a counteroffer.' }] },\n  { n:13, type:'Distinction', v:'barfract', h:'',\n    b:[{ t:'p', x:\"If saying no costs them something, it isn't a real ask.\" }] },\n  { n:14, type:'Exact phrase', v:'baranswer', h:'Endings that can take an answer',\n    b:[{ t:'p', x:'Tap one to keep it.' }], chipAlign:'stretch', chipUniform:true,\n    chips:['\u201cCan you do that, or is Thursday tight?\u201d', '\u201cWhich of these works better for you?\u201d',\n           '\u201cDoes that work? If not, what would?\u201d', '\u201cIs anything in the way I should know about?\u201d'] },\n  { n:15, type:'Better response \u00b7 payoff', v:'none', h:'The same thing, asked', payoff2:true, b:[] },\n  { n:16, type:'Summary visual', v:'none', h:'', playbook:true,\n    b:[{ t:'p', x:'A real ask opens into three real answers.' }] },\n  { n:17, type:'Distinction', v:'forkno', h:'',\n    b:[{ t:'p', x:'No ends that proposal. If they could say it without paying for it, the ask did its job.' }] },\n  { n:18, type:'Quiz \u00b7 diagram', v:'none', h:'Which slot does each part fill?', dquiz:true },\n  { n:19, type:'Quiz', v:'forksmall', h:\"What's wrong with this one?\", quiz:1 },\n  { n:20, type:'Rehearsal handoff', v:'bar4', h:'Now ask it out loud', handoff:true },\n];\n\nconst QUIZ = [\n  { setup:'', opts:[\n      '\u201cYou\\u2019re completely unreliable about deadlines.\u201d',\n      '\u201cSam, can you review pages 2 to 4 by noon and flag anything factually wrong?\u201d',\n      '\u201cCan someone follow up with the vendor?\u201d'],\n    correct:1,\n    ok:'An action they could do, a person who can answer, and timing that changes what done means.',\n    no:'The first describes the person, not an action. The vendor one names an action but gives it to the room, so nobody owns the answer. Only the Sam version gives one person something they could answer today.' },\n  { setup:'\u201cWould you mind staying late? I\\u2019d hate for this to affect how committed you look at review time.\u201d',\n    opts:[\n      \"It's too vague about what's needed\",\n      \"It's too blunt\",\n      \"It's clear enough, but saying no has a cost attached\"],\n    correct:2, okTitle:'Clear, but not free',\n    ok:'Clear and free are two different things. The wording is a question. The answer isn\\u2019t really available.',\n    no:'The ask is specific enough to act on, and it\\u2019s phrased politely. That\\u2019s the trap. What makes it a demand is the consequence hanging off the word no. Check what happens to a refusal, not how the sentence is worded.' }\n];\n\n/* Card 18, diagram quiz. The After ask arrives one fragment at a time and\n   the learner taps the BAR slot it fills. The correct-answer line is the\n   existing card 18 feedback, carried verbatim; the old wrong-answer text\n   described the three options this card no longer has, so each fragment\n   carries its own one-line miss instead. */\nconst DQ = {\n  frags:[\n    { x:'\u201cMaya,\u201d', slot:1, no:'That part names the person who can answer.' },\n    { x:'\u201ccan you send the revised two-page brief\u201d', slot:0, no:'That part is the thing you\\u2019d see or hear if it happened.' },\n    { x:'\u201cby 3 on Thursday?\u201d', slot:2, no:' uld they do?', null, null),\n      mkField('who', 'who', 'who can answer it?', 'whoSkipped',\n        ['Already obvious', 'Name someone'], \"It's already obvious who I'm asking\"),\n      mkField('when', 'when', 'only if it changes what done means', 'whenSkipped',\n        ['No deadline needed', 'Add a deadline'], \"No deadline needed\"),\n      mkField('answer', 'answer', 'how they could answer either way', null, null)\n    ];\n\n    const choiceStyle = 'flex:1;min-height:52px;border-radius:15px;border:1.5px solid rgba(81,40,136,.3);'\n      + 'background:#FFFFFF;color:#512888;font:600 13.5px/1.2 ' + F + ';cursor:pointer;padding:0 6px';\n    /* ACTION and ANSWER are required; WHO and WHEN are satisfied either by text\n       or by a deliberate skip. All three paths enable together. */\n    const transferReady = st.action.trim().length > 0 && st.answer.trim().length > 0\n      && (st.who.trim().length > 0 || st.whoSkipped)\n      && (st.when.trim().length > 0 || st.whenSkipped);\n    const choiceOff = 'flex:1;min-height:52px;border-radius:15px;border:1.5px solid rgba(23,26,31,.14);'\n      + 'background:rgba(23,26,31,.04);color:#646D77;font:600 13.5px/1.2 ' + F + ';cursor:default;padding:0 6px';\n    const transferChoices = (c.transfer && !st.done) ? ['Say it', 'Write it', 'Save it for later'].map((l) => ({\n      label:l, style:transferReady ? choiceStyle : choiceOff, off:!transferReady,\n      act:transferReady ? () => this.setState({ done:true, sent:l }) : () => {} })) : [];\n\n    /* Card 21 blanks the named move and the learner completes it by tap\n       before the card saves. The words are never derived by case-folding\n       the move: each blank holds its own literal. */\n    const mkSaved = (k, wd) => {\n      const on = st.sm[k];\n      return { x: on ? wd : '___',\n        fill: on ? () => {} : () => { const nx = st.sm.slice(); nx[k] = true; this.setState({ sm:nx }); },\n        style:'min-height:44px;display:flex;align-items:center;padding:0 10px;border-radius:11px;'\n          + 'font:700 19px/1 ' + F + ';letter-spacing:-.015em;box-sizing:border-box;'\n          + (on ? 'color:' + P + ';background:rgba(81,40,136,.08);cursor:default'\n            : 'color:' + GRAYTXT + ';background:transparent;border:1.5px dashed rgba(81,40,136,.34);cursor:pointer') };\n    };\n\n    const doneCopy = {\n      'Say it':'Your ask is held for this preview, word for word as you wrote it. This prototype does not store data.',\n      'Write it':'Your ask is held for this preview, word for word as you wrote it. This prototype does not store data.',\n      'Save it for later':'Your ask is held for this preview, word for word as you wrote it. This prototype does not store data.' };\n    const skipNote = (st.whenSkipped || st.whoSkipped)\n      ? 'The slots you left are stored as decisions, not gaps. Nothing here will ask you to add a deadline later.'\n      : '';\n\n    return {\n      card:c, visual: isDone ? this.barBlock(\n        ['filled', st.whoSkipped ? 'valid' : 'filled', st.whenSkipped ? 'valid' : 'filled', 'filled'],\n        '', { key:'dn' }) : this.visual(c.v),\n      blocks:(c.b || []).map((b) => ({ x:b.x, label:b.label || '', isP:b.t === 'p',\n        isQuote:b.t === 'q', isLabelled:b.t === 'l' })),\n      chips:chips, chipAlign:c.chipAlign || 'flex-start', toggle:toggle,\n      options:options, quizSetup: q ? q.setup : '',\n      showH:!!c.h,\n      vchips:(c.vchips || []).map((v) => ({ x:v.x,\n        style:'align-self:flex-start;padding:6px 11px;border-radius:99px;font:500 12px/1.25 ' + F\n          + ';' + (v.tone === 'clay'\n            ? 'background:rgba(168,69,42,.10);border:1px solid rgba(168,69,42,.34);color:' + CLAY\n            : 'background:rgba(81,40,136,.10);border:1px solid rgba(81,40,136,.30);color:' + P) })),\n      payoffA:c.payoff2 ? this.wish({ key:'p2a', dense:true, h:96 }) : null,\n      payoffB:c.payoff2 ? h('div', { key:'p2b', style:{ width:'100%' } },\n        this.bar(['filled', 'filled', 'filled', ' doneCopy[st.sent] : '', doneNote:isDone ? skipNote : '',\n      isHero:!!c.hero,\n      isStandard:!c.hero && !q && !c.dquiz && !c.payoff2 && !c.playbook && !c.handoff && !c.saved && !c.transfer,\n      isPayoff2:!!c.payoff2, isPlaybook:!!c.playbook, isDQuiz:!!c.dquiz,\n      isQuiz:!!q, isHandoff:!!c.handoff, isSaved:!!c.saved,\n      isTransfer:!!c.transfer && !isDone, isDone:isDone,\n      showNav:!c.transfer,\n      nextLabel: c.handoff ? 'Rehearsal, then card 21' : 'Next \\u203A',\n      nextStyle:'font:600 13px/1 ' + F + ';color:' + (c.handoff ? '#8A929B' : P)\n        + ';cursor:' + (c.handoff ? 'default' : 'pointer') + ';padding:8px 4px',\n      showTapZones:!c.handoff && !c.transfer && !q && !c.dquiz,\n      showHint:st.hint && i === 0,\n      backStyle:'font:600 13px/1 ' + F + ';color:' + (i ? DIM : 'transparent')\n        + ';cursor:' + (i ? 'pointer' : 'default') + ';padding:8px 4px',\n      back:() => this.go(-1), next:() => this.go(1),\n      restart:() => this.setState({ i:0, picks:{}, checked:{}, hint:true, done:false, sent:'',\n        action:'', who:'', when:'', answer:'', whenSkipped:false, whoSkipped:false,\n        demoWhen:'empty', sceneOpen:false, resumed:false,\n        dqStep:0, dqMiss:null, sm:[false, false, false] }),\n      openScene:() => this.setState({ sceneOpen:true }),\n      /* The sheet primary never advances the deck: it opens the explicit\n         voice-engine handoff notice. No rehearsal runs in this prototype. */\n      openHandoff:() => {}, handoffContinue:() => this.setState({ handoffOpen:false, i:Math.min(CARDS.length - 1, i + 1) }),\n      handoffBack:() => this.setState({ handoffOpen:false }),\n      backdropScene:(e) => { if (e.target === e.currentTarget) this.setState({ sceneOpen:false }); },\n      backdropHandoff:(e) => { if (e.target === e.currentTarget) this.setState({ handoffOpen:false }); },\n      trapKeys:(e) => this.trapKeys(e),\n      handoffOpen:st.handoffOpen,\n      resumed:st.resumed && !!c.saved,\n      d Card 16. Three numbered steps, each with its ACTION / WHO / ANSWER pill, its mini BAR state and its phrase stub, then the single summary sentence. This is the lesson thumbnail.' },\n        { name:'Diagram quiz', spec:'Card 18. The After ask arrives one fragment at a time and the learner taps the BAR slot it fills. Forward is gated until all four are placed; a miss marks the tapped slot and says what the fragment actually is.' },\n        { name:'Quiz', spec:'Card 19. Centred question, small FORK, three pills, Check answer disabled until a pick, then feedback and Continue. The correct answer sits at position 3.' },\n        { name:'Handoff', spec:'Card 20. BAR at 20% opacity, 96px mic dominant, forward gated: the scene sheet is the way on, Not now returns to the card.' },\n        { name:'Saved move', spec:'Card 21. The named move blanked as One ___. One ___. Room to ___. and completed by tap before the card saves, with the filled BAR as a thumbnail inside the card. Forward is gated until all three blanks are filled.' },\n        { name:'Transfer cue', spec:'Card 22. Four fields shaped like the slots, WHO and WHEN each carry a plain skip control, then three equal-weight choices with the same border, same fill, same type, no primary.' }\n      ],\n      tokens:[\n        { n:'Purple \\u00b7 what you produce', c:'#512888' },\n        { n:'Clay \\u00b7 what we\\u2019re correcting', c:'#A8452A' },\n        { n:'Valid-empty fill', c:'#E9E6F0' },\n        { n:'Paper field', c:'#FAF7F2' },\n        { n:'Ink', c:'#171A1F' },\n        { n:'Body', c:'#3E454D' },\n        { n:'Subordinate', c:'#646D77' }\n      ],\n      motionRules:[\n        'WISH drifts on a 9s loop, scale and translate only, never spinning. It is blurred, not drawn, so it can never read as a slot.',\n        'BAR slots arrive one at a time, 150ms apart, only up to the count the card has earned.',\n        'The ANSWER slot pulses once every 2.4s on card 12 and 20: a ring that expands and fades, no colour change.',\n        'Card 15 does not animate at all. It is two still panels, the blurred WISH above the filled BAR, so the comparison can be read rather than watched.',\n        'FORK branches drop in left to right, 110ms apart.',\n        'Everything is opacity and transform. No card height animates.',\n        'prefers-reduced-motion removes every animation and keeps end states. Card 11 keeps whichever WHEN state is selected; card 15 is unaffected, having no motion to remove.'\n      ],\n      cautions:[\n        'Cards 3 and 8 are stacked-quote cards and run past the 40-word body ceiling by design, each closing on a received-meaning chip rather than a headline. Card 15 carries no body blocks: its Before and After live inside the two-panel branch at 14.5px. Verified no scroll at 393 and 380.',\n        'Nothing in the deck counts slots. No progress meter, strength bar, \\u201c3 of 4\\u201d or \\u201ccomplete your ask\\u201d nudge exists, and the deck-level progress bar tracks cards, not slots.',\n        'Card 22 completes identically on all three choices: same title, same body, no path marked partial or pending. Do not reorder them or add primary styling later.',\n        'The tap-to-save on cards 9 and 14 is long-press on device, per the spec, or the save fires while the learner is reading.',\n        'Card 20 hands off to the voice engine. The eight beats, the trade trap at beat 4 and the mandatory same-moment retry live there, not in the deck. The sheet here is a preview only.',\n        'Hope\\u2019s nine features and six safety flags are not shown in the deck. Clarity and voluntariness stay on separate axes, so no card renders a single quality score.',\n        'Assumption: the saved-move \\u201cRehearse this one\\u201d action and the day-2 card back are named in copy but live outside the lesson deck, in Your Moves.',\n        'Card 21\\u2019s post-rehearsal status is an inline pill beside the eyebrow, not a floating toast, so it can never sit over the CTA.',\
